<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script>
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <header class="sidebar">
        <div class="site-identity">
          <h1>
            <a href="{{ "/" | absolute_url }}">
              <img src="{{site.logo | relative_url}}" alt="Spode's Abode - Home" />
            </a>
          </h1>
        </div>
        
        <div class="controls">
          <button class="icon-button theme-toggle" type="button" aria-label="Switch between light and dark theme">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span class="label-light">Light</span>
            <span class="label-dark">Dark</span>
          </button>
          <button class="icon-button menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
        </div>

        {% include nav.html %}
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p>Copyright Andrew Spode</p>
    </footer>
    <script>
      (function () {
        var header = document.querySelector('.sidebar');
        var menu = header.querySelector('.menu-toggle');
        menu.addEventListener('click', function () {
          var open = header.classList.toggle('nav-open');
          menu.setAttribute('aria-expanded', open);
        });
        header.querySelector('.theme-toggle').addEventListener('click', function () {
          var root = document.documentElement;
          var light = root.dataset.theme
            ? root.dataset.theme === 'light'
            : window.matchMedia('(prefers-color-scheme: light)').matches;
          var next = light ? 'dark' : 'light';
          root.dataset.theme = next;
          try { localStorage.setItem('theme', next); } catch (e) {}
        });
      })();
    </script>
    <script data-goatcounter="https://spodesabode.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
